version: "3.9"

# API-only stack: backend, plus Redis and the Celery worker/beat
# containers backend needs to actually function (see the note on those
# below). The frontend is NOT built or served by Docker/Compose at all -
# it's built as a static bundle (`npm run build` in frontend/, outside
# Docker) and served directly by the host's own nginx alongside its
# reverse-proxy to this backend. MySQL is also NOT run here - both MySQL and nginx
# are already installed directly on the host per this deployment's
# setup, so:
#   - redis/backend/worker/scheduler/seed all use `network_mode: host`
#     (see each service below) - this makes them share the HOST's own
#     network namespace directly, rather than Compose's isolated bridge
#     network. That's what lets DATABASE_URL/REDIS_URL just say
#     `localhost` (see backend/.env.example) instead of needing the
#     `host.docker.internal` + `extra_hosts:` workaround - with host
#     networking, the container's `localhost` genuinely IS the host's.
#   - the host's own nginx reverse-proxies to the backend's port 8002
#     directly on the host (no Docker port-mapping involved anymore -
#     see the note on `ports:` below), and serves the frontend's built
#     static files itself - this file doesn't touch that nginx config.
#
# IMPORTANT trade-offs of `network_mode: host` (why it's not the
# default choice, and why adminer below deliberately does NOT use it):
#   - Linux-only. Docker Desktop (Mac/Windows) does not support host
#     networking the same way - containers there would NOT reach the
#     host or each other as expected. Fine for this deployment (a real
#     Linux server), but do not assume this compose file behaves the
#     same on a Windows/Mac dev machine.
#   - Removes network *isolation* between these containers and the
#     host, not just convenience: a compromised backend/worker process
#     can now reach (and bind to) anything on the host's network
#     interfaces directly, the same as a native process could - there's
#     no bridge/NAT boundary in the way anymore. Acceptable here since
#     these containers already needed host DB access either way, but
#     worth knowing before copying this pattern elsewhere.
#   - `ports:` mappings do nothing under host networking (the process
#     just binds the host port directly, like a non-Docker service
#     would) - kept out of the services below to avoid implying
#     otherwise. Double-check nothing else on the host already listens
#     on 8002 before deploying.
#   - Services under host networking can no longer reach each other by
#     Compose service name (e.g. `redis`) - only by `localhost`, since
#     they're not on an isolated Compose network together anymore. That
#     is why redis/backend/worker/scheduler/seed ALL use host
#     networking together here (consistently, or not at all).
#
# Why worker/scheduler are here even though this is "just the API":
# they're Celery processes, not optional extras - per README.md, without
# them queued webhook deliveries and renewal reminders silently sit at
# PENDING forever (nothing errors, they just never get attempted). Ask
# if you genuinely want to run without them.
#
# Usage (run from the repo root):
#   cp backend/.env.example backend/.env     # backend runtime secrets
#   docker compose up --build -d
#   docker compose run --rm seed              # first time only

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host   # see the header comment above - shares the host's network directly
    command: redis-server --appendonly yes   # persist queued/pending Celery tasks across restarts
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Binds directly to the host's 6379 (network_mode: host, no `ports:`
    # needed/possible) - reachable by backend/worker/scheduler below via
    # `localhost:6379`, since they share this same host network too.
    # Make sure nothing else on the host is already using 6379.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host   # see the header comment above - lets DATABASE_URL/REDIS_URL just use "localhost"
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    # No `ports:` - meaningless under host networking (see header
    # comment); the app binds directly to the host's 8002, same as
    # host nginx's proxy_pass expects (127.0.0.1:8002).
    # No bind-mounted source on a real server (unlike a dev compose file)
    # - the image already has the code baked in from the build above, so
    # a code change means rebuilding the image, not editing a live mount.

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    # Exactly one scheduler container, ever - never scale this service.
    # Two beat processes double-fire every scheduled task (duplicate
    # webhook dispatch attempts, duplicate renewal-reminder emails, etc.)
    # - see backend/app/core/celery_app.py's beat_schedule.
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/app/var/celerybeat-schedule

  # One-shot: seeds plans/roles/the bootstrap admin (idempotent - see
  # backend/app/core/seed.py docstring, safe to re-run). NOT part of the
  # normal `docker compose up` run - a fresh deploy shouldn't silently
  # reseed on every restart. Run it explicitly once:
  #   docker compose run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host
    env_file:
      - ./backend/.env
    profiles: ["tools"]
    entrypoint: []
    command: python -m app.core.seed

  # Optional, testing-only: a lightweight web UI to browse/query the
  # host's MySQL from inside this Compose network - the quickest way to
  # confirm containers can actually reach the host-installed database
  # via `host.docker.internal` (same mechanism backend/worker/scheduler
  # use for DATABASE_URL above) before trusting the app's own connection.
  #
  # NOT part of the normal `docker compose up` run (same `tools` profile
  # as `seed` above) - a database admin UI should never be running by
  # default, especially not on a production server.
  #
  # SECURITY WARNING: bound to 0.0.0.0 (all interfaces), so port 8081 is
  # reachable from anywhere that can route to this host - including the
  # public internet, unless your host firewall/cloud security group
  # blocks it. A full DB-admin login panel exposed like this is a real
  # compromise vector (credential brute-forcing, or a future Adminer
  # CVE). Before starting it:
  #   - Confirm 8081/tcp is NOT open to 0.0.0.0/0 in your firewall/cloud
  #     security group - allow only your own IP(s) if you must open it
  #     at all.
  #   - Prefer restricting the compose binding itself to your LAN
  #     subnet/known IP instead of 0.0.0.0, e.g. "10.0.0.0/24" isn't
  #     valid here, but a single known client IP is:
  #     "<your-ip>:8081:8080" (Compose port bindings don't support CIDR
  #     ranges) - or bind to the server's LAN NIC address only, e.g.
  #     "192.168.1.50:8081:8080".
  #   - Stop the container the moment you're done testing (below) -
  #     don't leave it running.
  #
  # Start it only when you need it:
  #   docker compose --profile tools up -d adminer
  # Then open http://<server-ip>:8081 and log in with:
  #   System:   MySQL
  #   Server:   host.docker.internal
  #   Username/Password: the app DB user from backend/.env.example's
  #     DATABASE_URL section (or your MySQL root credentials, only if
  #     you specifically need to confirm host connectivity/grants).
  # Stop it again as soon as you're done testing:
  #   docker compose --profile tools stop adminer
  #
  # Deliberately stays on Compose's normal bridge network (NOT
  # network_mode: host like the services above) - it only ever needs to
  # reach the host's MySQL, which `host.docker.internal` already gives
  # it, and keeping it bridged means its `ports:` mapping below still
  # works normally (host networking would make that mapping a no-op).
  adminer:
    image: adminer:4.8.1
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["tools"]
    ports:
      - "8081:8080"

volumes:
  redis_data:
