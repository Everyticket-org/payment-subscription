version: "3.9"

# Two app containers - backend and frontend - plus Redis and the Celery
# worker/beat containers backend needs to actually function (see the
# note on those below). MySQL and the reverse proxy (nginx) are NOT run
# here - both are already installed directly on the host per this
# deployment's setup.
#
# backend/worker/scheduler/seed use `network_mode: host` (a deliberate
# choice over the bridge-network + host.docker.internal alternative -
# see git history for that version if you ever want it back): the
# container shares the host's network namespace directly, so
# "localhost" inside it IS the host's localhost - DATABASE_URL and
# REDIS_URL/CELERY_*_URL can just say "localhost", exactly like running
# these processes bare-metal would. Trade-off: less network isolation
# than the bridge+port-mapping approach (the container can reach/bind
# anything the host's network stack can) - a deliberate choice for this
# deployment, not a default to copy elsewhere without thinking about it.
#
# LINUX ONLY: network_mode: host is a real, native feature on Linux
# Docker Engine (which is what the production server runs), but Docker
# Desktop (Windows/Mac) does NOT actually support it - Desktop runs
# containers inside its own Linux VM, so "host" there means the VM's
# network namespace, not the real host's, and this silently does NOT
# work (accepted without error, but "localhost" doesn't reach anything
# on the actual machine). Confirmed by testing on Windows during this
# setup - could not be verified end-to-end there for that reason. Test
# this for real on the actual Linux server before relying on it.
#
# frontend is DELIBERATELY NOT host-networked: its internal nginx
# listens on port 80, which would collide directly with the host's own
# (real) nginx also on port 80. It stays on the normal bridge network
# with an explicit port mapping instead (3000:80) - the host's nginx
# reverse-proxies to that port same as it would with host networking,
# just via an explicit published port instead of a shared stack.
#
# Because backend is host-networked, it can't resolve "redis" as a
# service name (no virtual network to resolve that on) - redis keeps
# its normal bridge networking but ALSO publishes its port to the host
# (6379:6379) so host-networked backend/worker/scheduler can reach it
# at localhost:6379, same as DATABASE_URL.
#
# Usage (run from the repo root):
#   cp backend/.env.example backend/.env     # backend runtime secrets
#   cp .env.example .env                     # compose-level build args (VITE_API_BASE_URL)
#   docker compose up --build -d
#   docker compose run --rm seed              # first time only

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes   # persist queued/pending Celery tasks across restarts
    ports:
      - "6379:6379"   # required so host-networked backend/worker/scheduler can reach it via localhost - see file header
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    network_mode: host   # see file header - lets DATABASE_URL/REDIS_URL just say "localhost"
    depends_on:
      redis:
        condition: service_healthy
    # No `ports:` - meaningless with network_mode: host (the container
    # binds directly to the host's ports; Dockerfile's CMD already binds
    # uvicorn to :8002, so that's what's actually listening on the host).
    #
    # No bind-mounted source on a real server (unlike a dev compose file)
    # - the image already has the code baked in from the build above, so
    # a code change means rebuilding the image, not editing a live mount.

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    # Exactly one scheduler container, ever - never scale this service.
    # Two beat processes double-fire every scheduled task (duplicate
    # webhook dispatch attempts, duplicate renewal-reminder emails, etc.)
    # - see backend/app/core/celery_app.py's beat_schedule.
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/app/var/celerybeat-schedule

  # One-shot: seeds plans/roles/the bootstrap admin (idempotent - see
  # backend/app/core/seed.py docstring, safe to re-run). NOT part of the
  # normal `docker compose up` run - a fresh deploy shouldn't silently
  # reseed on every restart. Run it explicitly once:
  #   docker compose run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    network_mode: host
    profiles: ["tools"]
    entrypoint: []
    command: python -m app.core.seed

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # BUILD-time only (see frontend/Dockerfile's own comment) - must
        # be a URL the BROWSER can reach (your public domain/host nginx
        # path to the backend), never a Docker-internal service name.
        # Set the real value in this file's own .env (compose-level,
        # NOT backend/.env) - see .env.example.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8002}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  redis_data:
