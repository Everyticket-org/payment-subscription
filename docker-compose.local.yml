# Complete, standalone local stack - NOT an overlay on docker-compose.yml
# (the production file), because that one uses network_mode: host,
# which does NOT work on Docker Desktop (Windows/Mac) - confirmed by
# testing during this setup (see docker-compose.yml's own header
# comment). This file uses ordinary bridge networking +
# host.docker.internal instead, which DOES work here, plus a
# containerized nginx so local testing matches production's actual
# single-origin shape (see nginx.local.conf's header comment).
#
# Uses backend/.env.local (not backend/.env) - a separate file so this
# never depends on or interferes with whatever backend/.env is set to
# for the network_mode: host production setup.
#
# Usage (run from the repo root):
#   docker compose -f docker-compose.local.yml up --build -d
#   docker compose -f docker-compose.local.yml run --rm seed   # first time only
#   open http://localhost:8080

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/app/var/celerybeat-schedule

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["tools"]
    entrypoint: []
    command: python -m app.core.seed

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  redis_local_data:
