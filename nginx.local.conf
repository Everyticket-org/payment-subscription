# LOCAL-ONLY reverse proxy config, used by the "nginx" service in
# docker-compose.local.yml. This is NOT what runs in production - there,
# your host's own nginx plays this exact role (see the location blocks
# given alongside docker-compose.local.yml for the production
# equivalent to add to that config).
#
# The point of running this locally at all: it makes local testing
# match production's actual shape - one single origin serving both the
# built frontend and the API (path-routed), rather than two separate
# ports with no proxy in front. Browser hits http://localhost:8080 for
# everything; CORS never even enters into it for traffic through here,
# since frontend and API become the same origin.
#
# Uses Docker service names (backend/frontend), not 127.0.0.1 - this
# container is on the same compose network as those services, unlike
# your host's production nginx, which is NOT in that network and so
# uses 127.0.0.1:8002/127.0.0.1:3000 instead (see the note given with
# docker-compose.local.yml).

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://backend:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8002/health;
    }

    # FastAPI's interactive docs - handy locally, but think twice before
    # exposing these on the real public domain (see the note given
    # alongside docker-compose.local.yml).
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8002;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
