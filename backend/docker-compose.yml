version: "3.9"

# Backend-only stack: Redis + backend API + Celery worker + Celery beat,
# all built from the one Dockerfile in this same directory (see its own
# comment - worker/beat just override `command:` below). The frontend is
# a separate app/origin (see ../frontend) and isn't part of this file -
# run it with its own Dockerfile/`npm run dev`, or ask for a dedicated
# frontend compose file if you want one alongside this.
#
# MySQL is NOT run here - this deployment's database (plans-subscription)
# already lives on an existing MySQL/MariaDB installed directly on the
# host, so DATABASE_URL in .env points at `host.docker.internal` (Docker's
# hostname for "the machine this container's engine runs on") rather than
# a container this file manages. If you're setting this up somewhere that
# has no pre-existing DB, see the git history for this file - an earlier
# version bundled a `mysql` service; ask for that version back rather than
# rebuilding it from scratch.
#
# For host.docker.internal to resolve on Linux (it works out of the box
# on Docker Desktop for Windows/Mac, but NOT on plain Linux Docker Engine
# by default), every service below that talks to the host DB carries:
#   extra_hosts: ["host.docker.internal:host-gateway"]
# (Docker 20.10+ - if your server's Docker is older than that, upgrade it
# rather than working around this.)
#
# The host MySQL itself also needs two things done to it once, or every
# container here will get "Access denied"/"Connection refused" even with
# the extra_hosts entry in place - see the MySQL commands + bind-address
# note in .env.example's DATABASE_URL comment:
#   1. bind-address in my.cnf/mariadb.conf.d must not be left at
#      127.0.0.1-only (that only accepts true loopback, not a container's
#      bridge-network IP).
#   2. The DB user in DATABASE_URL must be GRANTed for a host pattern that
#      covers the Docker bridge network, not just '<user>'@'localhost' -
#      debian-sys-maint (Debian/Ubuntu's MySQL package-maintenance
#      account) is @'localhost'-only and CANNOT be widened safely for
#      this - use a separate, dedicated app user instead (see
#      .env.example for the exact CREATE USER/GRANT statements).
#
# Usage (run from this directory - backend/):
#   cp .env.example .env   # then fill in real secrets - see file comments
#   docker compose up --build -d
#   docker compose run --rm seed   # first time only: seed plans/admin user

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes   # persist queued/pending Celery tasks across restarts
    ports:
      - "6379:6379"   # remove this on a real server unless you need external Redis access
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets DATABASE_URL reach the host's MySQL - see file header
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    # No bind-mounted source on a real server (unlike a dev compose file)
    # - the image already has the code baked in from the build above, so
    # a code change means rebuilding the image, not editing a live mount.

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    # Exactly one scheduler container, ever - never scale this service.
    # Two beat processes double-fire every scheduled task (duplicate
    # webhook dispatch attempts, duplicate renewal-reminder emails, etc.)
    # - see app/core/celery_app.py's beat_schedule.
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/app/var/celerybeat-schedule

  # One-shot: seeds plans/roles/the bootstrap admin (idempotent - see
  # app/core/seed.py docstring, safe to re-run). NOT part of the normal
  # `docker compose up` run - a fresh deploy shouldn't silently reseed on
  # every restart. Run it explicitly once:
  #   docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["tools"]
    entrypoint: []
    command: python -m app.core.seed

volumes:
  redis_data:
