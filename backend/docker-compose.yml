version: "3.9"

# Full stack for this app: MySQL + Redis + backend API + Celery worker +
# Celery beat, all built from the one backend/Dockerfile image (see its
# own comment - worker/beat just override `command:` below).
#
# Was previously wired to a "postgres" service, left over from before the
# 2026-09-13 "change database to mysql" switch (see app/core/config.py's
# DATABASE_URL comment) - this replaces it with mysql so DATABASE_URL in
# .env.example actually matches what gets started here.
#
# Usage:
#   cp .env.example .env   # then fill in real secrets - see file comments
#   docker compose up --build -d
#   docker compose run --rm seed   # first time only: seed plans/admin user

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Root password only initializes the container - the app itself
      # connects as MYSQL_USER (see DATABASE_URL in .env), never root.
      # No hardcoded fallback for the root password: MySQL refuses to
      # start without one, which is the right failure mode here rather
      # than silently booting with a guessable default on a real server.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-subscription}
      MYSQL_USER: ${MYSQL_USER:-subscription}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-subscription}
    ports:
      - "3306:3306"   # remove this on a real server unless you need external DB access
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes   # persist queued/pending Celery tasks across restarts
    ports:
      - "6379:6379"   # remove this on a real server unless you need external Redis access
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    # No bind-mounted source on a real server (unlike a dev compose file)
    # - the image already has the code baked in from the build above, so
    # a code change means rebuilding the image, not editing a live mount.

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Exactly one scheduler container, ever - never scale this service.
    # Two beat processes double-fire every scheduled task (duplicate
    # webhook dispatch attempts, duplicate renewal-reminder emails, etc.)
    # - see app/core/celery_app.py's beat_schedule.
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/app/var/celerybeat-schedule

  # One-shot: seeds plans/roles/the bootstrap admin (idempotent - see
  # app/core/seed.py docstring, safe to re-run). NOT part of the normal
  # `docker compose up` run - a fresh deploy shouldn't silently reseed on
  # every restart. Run it explicitly once:
  #   docker compose run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["tools"]
    entrypoint: []
    command: python -m app.core.seed

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The BROWSER (on the host, not this container) calls this URL, so
      # "localhost" here means the host's localhost - matches backend's
      # "8002:8002" port publish above. Point this at your real domain
      # once this is behind a hostname/reverse proxy.
      - VITE_API_BASE_URL=http://localhost:8002
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # Dev-mode Vite server (see frontend/Dockerfile) - fine for an
    # internal/staging box, but not a production static build yet. Ask
    # if you want a production nginx-served build added here.
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  mysql_data:
  redis_data:
