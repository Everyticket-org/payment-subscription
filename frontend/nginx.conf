# Serves the static production build inside the frontend container. This
# is INTERNAL to the container - your existing host nginx (already
# installed on the server, per the deploy setup) sits in front of this
# and reverse-proxies to whatever host port this container publishes
# (see docker-compose.yml's frontend service - default 3000 -> 80 here).
# This file has no TLS/domain config on purpose; that stays the host
# nginx's job.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router (client-side routing) needs every path
    # that isn't a real static file to still serve index.html, or a
    # hard refresh on e.g. /admin/login 404s instead of reaching the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed build assets (Vite fingerprints
    # filenames, so a new deploy naturally gets new URLs - safe to cache
    # aggressively). index.html itself is NOT matched here, so it's
    # always revalidated and picks up new asset hashes on each deploy.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
